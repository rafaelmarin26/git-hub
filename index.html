<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boas Vindas | NoCode</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      color: #ffffff;
      text-align: center;
      padding: 24px;
    }

    main {
      max-width: 640px;
    }

    .badge {
      display: inline-block;
      font-size: 0.875rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 6px 16px;
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 999px;
      margin-bottom: 32px;
    }

    h1 {
      font-size: clamp(2.5rem, 8vw, 4.5rem);
      font-weight: 800;
      line-height: 1.1;
      margin-bottom: 20px;
    }

    p {
      font-size: clamp(1rem, 3vw, 1.25rem);
      line-height: 1.6;
      color: rgba(255, 255, 255, 0.85);
    }
  </style>
</head>
<body>
  <main>
    <span class="badge">NoCode</span>
    <h1>Boas Vindas</h1>
    <p>Que bom ter você aqui! Esta é a nossa comunidade de alunos NoCode. Prepare-se para aprender, criar e transformar ideias em projetos reais.</p>
  </main>
</body>
</html>
